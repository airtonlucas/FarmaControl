<!DOCTYPE html>
<html lang = "pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Itens-Venda </title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/itemvenda.css">

</head>

<body>

<header>
    <h1>FarmaControl ERP</h1>
    <p>Itens da Venda</p>
</header>

<nav>
    <ul>
        <li><a href = "produto.html">Produtos</a></li>
        <li><a href="cliente.html">Clientes</a>
        <li><a href="fornecedor.html">Fornecedores</a></li>
        <li><a href="venda.html">Vendas</a></li>
        <li><a href="item-venda.html">Itens da Venda</a></li>

    </ul>
</nav>

<main>

    <h2>Cadastro de Itens de Venda</h2>

    <form id="formItemVenda">
    <input type="hidden" id="idItemVenda">
    
        <div>
        <label for= "vendaId">Venda ID:</label>
        <input type="text" id="vendaId" name="vendaId">
        </div>

        <div>
        <label for= "produtoId">Produto ID:</label>
        <input type="text" id="produtoId" name="produtoId">
        </div>

    <div>
        <label for= "quantidade">Quantidade:</label>
      <input type="number" id="quantidade" name="quantidade">
    </div>

    <div>
        <label for="precounitario">Preço:</label>
       <input type="number" id="precounitario" name="precounitario" step="0.01">
    </div>

    
    
    <div class="botoes">

        <button class="btn-cadastrar" type="submit">
            Cadastrar</button>

        <button class="btn-atualizar" type="submit">
            Atualizar</button>

        <button class="btn-limpar" type="reset">
            Limpar</button>
    </div>

         </form>

        <table>
          <thead>

         <tr>
            <th>ID</th>
            <th>Venda Id</th>
            <th>Produto Id</th>
            <th>Quantidade</th>
            <th>Preço</th>
    </thead>

    <tbody id="tabelaItemVenda">

    </tbody> 
    </table>
</main>

<footer>Informações adicionais</footer>
<script src="../js/item-venda.js"></script>
</body>
