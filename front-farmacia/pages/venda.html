<!DOCTYPE html>
<html lang = "pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Vendas </title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/venda.css">

</head>

<body>

<header>
    <h1>FarmaControl ERP</h1>
    <p>Vendas</p>
</header>

<nav>
    <ul>
        <li><a href = "produto.html">Produtos</a></li>
        <li><a href="cliente.html">Clientes</a>
        <li><a href="fornecedor.html">Fornecedores</a></li>
        <li><a href="venda.html">Vendas</a></li>
        <li><a href="item-venda.html">Itens da Venda</a></li>

    </ul>
</nav>

<main>

    <h2>Cadastro de Vendas</h2>

    <form id="formVenda">
    <input type="hidden" id="VendaID">
        <div>
        <label for= "clienteID">Cliente ID:</label>
        <input type="text" id="clienteID" name="ClienteID">
        </div>

        <div>
        <label for= "dataVenda">Data da Venda:</label>
        <input type="datetime-local" id="dataVenda" name="dataVenda">
        </div>

    <div>
        <label for= "valorTotal">Valor Total:</label>
      <input type="number" id="valorTotal" name="valorTotal" step="0.01">
    </div>

    <div class="botoes">

        <button class="btn-cadastrar" type="submit">
            Cadastrar</button>

        <button class="btn-atualizar" type="button">
            Atualizar</button>

        <button class="btn-limpar" type="reset">
            Limpar</button>
    </div>

         </form>

        <table>
          <thead>

         <tr>
            <th>ID</th>
            <th>Cliente ID</th>
            <th>Data da Venda</th>
            <th>Valor Total</th>
            
    </thead>

    <tbody id="tabelaVenda">

    </tbody> 
    </table>
</main>

<footer>Informações adicionais</footer>
<script src="../js/venda.js"></script>
</body>
