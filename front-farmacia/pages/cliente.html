<!DOCTYPE html>
<html lang = "pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Clientes </title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cliente.css">

</head>

<body>

<header>
    <h1>FarmaControl ERP</h1>
    <p>Clientes</p>
</header>

<nav>
    <ul>
        <li><a href = "produto.html">Produtos</a></li>
        <li><a href="cliente.html">Clientes</a>
        <li><a href="fornecedor.html">Fornecedores</a></li>
        <li><a href="venda.html">Vendas</a></li>
        <li><a href="item-venda.html">Itens da Venda</a></li>

    </ul>
</nav>

<main>

    <h2>Cadastro de Clientes</h2>

    <form id="formCliente">
    <input type="hidden" id="idCliente">
        <div>
            <label for= "nome">Nome do Cliente:</label>
        <input type="text" id="nome" name="nome">
        </div>

        <div>
             <label for= "cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf">
        </div>

    <div>
        <label for= "telefone">Telefone:</label>
      <input type="text" id="telefone" name="telefone">
    </div>

    <div>
        <label for= "email">Email:</label>
      <input type="text" id="email" name="email">
    </div>

    <div class="botoes">

        <button class="btn-cadastrar" type="submit">
            Cadastrar</button>

        <button class="btn-atualizar" type="button" onclick="atualizarClientePeloFormulario()">
            Atualizar</button>

        <button class="btn-limpar" type="reset">
            Limpar</button>
    </div>

         </form>

        <table>
          <thead>
         <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>Email</th>
            <th>Ações</th>
    </thead>

    <tbody id="tabelaClientes">
        <!--Aqui os clientes serão inseridos pelo JS-->
    </tbody> 
    </table>
</main>
<footer>Informações adicionais</footer>
<script src="../js/cliente.js"></script>
</body>
