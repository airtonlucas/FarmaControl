<!DOCTYPE html>
<html lang = "pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Produtos Farmaceûticos </title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/produto.css">

</head>

<body>

<header>
    <h1>FarmaControl ERP</h1>
    <p>Produtos</p>
</header>

<nav>
    <ul>
        <li><a href = "produto.html">Produtos</a></li>
        <li><a href="cliente.html">Clientes</a>
        <li><a href="fornecedor.html">Fornecedores</a></li>
        <li><a href="venda.html">Vendas</a></li>
        <li><a href="item-venda.html">Itens da Venda</a></li>

    </ul>
</nav>

<main>

    <h2>Cadastro de Produtos</h2>

    <form id="formProduto">
        <div>
        <label for= "nome">Nome do Produto:</label>
        <input type="text" id="nome" name="nome">
        </div>

        <div>
         <label for= "categoria">Categoria:</label>
        <input type="text" id="categoria" name="categoria">
        </div>

    <div>
    <label for= "preco" >Preço:</label>
      <input type="number" id="preco" name="preco" step="0.01">
    </div>

    <div>
        <label for= "quantidadeEstoque">Quantidade em Estoque:</label>
       <input type="number" id="quantidadeEstoque" name="quantidadeEstoque">
    </div>

    <div>
        <label for="dataValidade">Data de Validade:</label>
        <input type="date" id="dataValidade" name="dataValidade">
    </div>

    <div>
        <label for="codigoBarras">Código de Barras:</label>
        <input type="text" id="codigoBarras" name="codigoBarras">
    </div>

    <div class="botoes">

        <button class="btn-cadastrar" type="submit">Cadastrar</button>

        <button class="btn-atualizar" type="button">Atualizar</button>

        <button class="btn-limpar" type="reset">Limpar</button>
    </div>

         </form>

        <table>
          <thead>
         <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Validade</th>
            <th>Código de Barras</th>
            <th>Fornecedor</th>
            <th>Ações</th>
    </thead>

    <tbody id="tabelaProdutos"> 
        <!-- aqui os produtos serão inseridos pelo <JS-->
    </tbody> 

    </table>
</main>

<footer>Informações adicionais</footer>

<script src="../js/produto.js"></script>
</body>
